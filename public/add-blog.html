<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">SimpleBlog</div>
        <nav>
            <!-- UPDATED: Relative paths for GitHub Pages compatibility -->
            <a href="./index.html">Home</a>
            <a href="./add-blog.html">Add Blog</a>
        </nav>
    </header>
    
    <main class="container">
        <div class="form-container">
            <h1>Create a New Blog Post</h1>
            
            <!-- New div for DOM manipulation messages -->
            <div id="messageBox" class="message-box"></div>
            
            <!-- Added id="addBlogForm" so JS can find it -->
            <form class="blog-form" id="addBlogForm">
                <div class="form-group">
                    <label for="title">Blog Title:</label>
                    <input type="text" id="title" name="title" placeholder="Enter post title...">
                </div>
                <div class="form-group">
                    <label for="content">Content:</label>
                    <textarea id="content" name="content" rows="8" placeholder="Write your blog post here..."></textarea>
                </div>
                <button type="submit" class="btn-primary">Publish Post</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Simple Blog Management System</p>
    </footer>

    <!-- Link to our new JS file -->
    <script src="./script.js"></script>
</body>
</html>
